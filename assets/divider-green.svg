<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 32" width="100%" height="32" fill="none">
  <defs>
    <linearGradient id="lineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00FF66" stop-opacity="0" />
      <stop offset="20%" stop-color="#00FF66" stop-opacity="0.25" />
      <stop offset="50%" stop-color="#00FF66" stop-opacity="0.9" />
      <stop offset="80%" stop-color="#00FF66" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#00FF66" stop-opacity="0" />
    </linearGradient>
    <linearGradient id="laserGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00FF66" stop-opacity="0" />
      <stop offset="60%" stop-color="#00FF66" stop-opacity="0.8" />
      <stop offset="95%" stop-color="#ffffff" stop-opacity="1" />
      <stop offset="100%" stop-color="#00FF66" stop-opacity="0" />
    </linearGradient>
    <filter id="neonGlow" x="-20%" y="-50%" width="140%" height="200%">
      <feGaussianBlur stdDeviation="3" result="blur1" />
      <feGaussianBlur stdDeviation="6" result="blur2" />
      <feMerge>
        <feMergeNode in="blur2" />
        <feMergeNode in="blur1" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <style>
      .comet-pulse {
        animation: cometMove 3.5s cubic-bezier(0.4, 0, 0.2, 1) infinite;
      }
      .center-diamond {
        animation: diamondPulse 2s ease-in-out infinite alternate;
        transform-origin: 450px 16px;
      }
      .side-dots {
        animation: dotsFade 2s ease-in-out infinite alternate;
      }
      @keyframes cometMove {
        0% { transform: translateX(-300px); opacity: 0; }
        15% { opacity: 1; }
        85% { opacity: 1; }
        100% { transform: translateX(950px); opacity: 0; }
      }
      @keyframes diamondPulse {
        0% { transform: scale(0.9) rotate(45deg); filter: drop-shadow(0 0 2px #00FF66); }
        100% { transform: scale(1.25) rotate(45deg); filter: drop-shadow(0 0 10px #00FF66) drop-shadow(0 0 20px #00FF66); }
      }
      @keyframes dotsFade {
        0% { opacity: 0.3; }
        100% { opacity: 0.95; }
      }
    </style>
  </defs>

  <!-- Base Ambient Line -->
  <line x1="40" y1="16" x2="860" y2="16" stroke="url(#lineGrad)" stroke-width="1.5" />
  
  <!-- Glowing Center Track -->
  <line x1="200" y1="16" x2="700" y2="16" stroke="#00FF66" stroke-opacity="0.6" stroke-width="2" filter="url(#neonGlow)" />

  <!-- Animated Comet Beam -->
  <g class="comet-pulse">
    <rect x="0" y="14" width="220" height="4" rx="2" fill="url(#laserGrad)" filter="url(#neonGlow)" />
  </g>

  <!-- Tech Dots and Brackets -->
  <g class="side-dots" fill="#00FF66">
    <circle cx="280" cy="16" r="2.5" />
    <circle cx="300" cy="16" r="1.5" />
    <circle cx="320" cy="16" r="2" />
    <circle cx="580" cy="16" r="2" />
    <circle cx="600" cy="16" r="1.5" />
    <circle cx="620" cy="16" r="2.5" />
  </g>

  <!-- Central Glowing Diamond Node -->
  <g filter="url(#neonGlow)">
    <rect class="center-diamond" x="444" y="10" width="12" height="12" rx="2" fill="#00FF66" />
    <circle cx="450" cy="16" r="2" fill="#ffffff" />
  </g>
</svg>
