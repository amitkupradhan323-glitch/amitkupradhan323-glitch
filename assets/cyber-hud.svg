<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 180" width="100%" height="180" fill="none">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="hudBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#02140a" stop-opacity="0.95" />
      <stop offset="50%" stop-color="#052414" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#010e07" stop-opacity="0.98" />
    </linearGradient>

    <!-- Neon Glow Filter -->
    <filter id="hudGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <linearGradient id="scanlineGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#00FF66" stop-opacity="0" />
      <stop offset="50%" stop-color="#00FF66" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#00FF66" stop-opacity="0" />
    </linearGradient>

    <linearGradient id="neonBarGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00FF66" />
      <stop offset="100%" stop-color="#10B981" />
    </linearGradient>

    <style>
      @keyframes scanlineAnim {
        0% { transform: translateY(-180px); }
        100% { transform: translateY(180px); }
      }
      @keyframes pulseDot {
        0%, 100% { opacity: 1; transform: scale(1); }
        50% { opacity: 0.3; transform: scale(0.8); }
      }
      @keyframes borderBlink {
        0%, 100% { stroke-opacity: 0.8; }
        50% { stroke-opacity: 0.3; }
      }
      @keyframes streamRain {
        0% { transform: translateY(-40px); opacity: 0; }
        50% { opacity: 0.8; }
        100% { transform: translateY(120px); opacity: 0; }
      }
      @keyframes barLoad {
        0% { width: 0%; }
        50% { width: 92%; }
        100% { width: 92%; }
      }
      .scanline {
        animation: scanlineAnim 4s linear infinite;
      }
      .pulse-dot {
        animation: pulseDot 1.5s ease-in-out infinite;
        transform-origin: 34px 34px;
      }
      .border-glow {
        animation: borderBlink 3s ease-in-out infinite;
      }
      .rain-col1 { animation: streamRain 3s linear infinite; }
      .rain-col2 { animation: streamRain 2.4s linear 0.8s infinite; }
      .rain-col3 { animation: streamRain 3.6s linear 1.5s infinite; }
      .bar-progress { animation: barLoad 3s ease-out forwards; }
      .hud-text { font-family: 'Courier New', Courier, monospace; font-weight: 600; }
    </style>
  </defs>

  <!-- Card Frame -->
  <rect x="2" y="2" width="876" height="176" rx="14" fill="url(#hudBg)" stroke="#00FF66" stroke-width="1.5" class="border-glow" />
  
  <!-- Subtle Grid Pattern -->
  <g stroke="#00FF66" stroke-opacity="0.06" stroke-width="1">
    <line x1="0" y1="45" x2="880" y2="45" />
    <line x1="0" y1="90" x2="880" y2="90" />
    <line x1="0" y1="135" x2="880" y2="135" />
    <line x1="220" y1="0" x2="220" y2="180" />
    <line x1="440" y1="0" x2="440" y2="180" />
    <line x1="660" y1="0" x2="660" y2="180" />
  </g>

  <!-- Animated Scanline Sweep -->
  <g clip-path="url(#cardClip)">
    <rect class="scanline" x="2" y="0" width="876" height="60" fill="url(#scanlineGrad)" pointer-events="none" />
  </g>

  <!-- Cyber Corners -->
  <path d="M 12 26 L 12 12 L 26 12" stroke="#00FF66" stroke-width="3" stroke-linecap="round" fill="none" filter="url(#hudGlow)" />
  <path d="M 868 26 L 868 12 L 854 12" stroke="#00FF66" stroke-width="3" stroke-linecap="round" fill="none" filter="url(#hudGlow)" />
  <path d="M 12 154 L 12 168 L 26 168" stroke="#00FF66" stroke-width="3" stroke-linecap="round" fill="none" filter="url(#hudGlow)" />
  <path d="M 868 154 L 868 168 L 854 168" stroke="#00FF66" stroke-width="3" stroke-linecap="round" fill="none" filter="url(#hudGlow)" />

  <!-- Top Status Bar -->
  <circle cx="34" cy="34" r="5" fill="#00FF66" class="pulse-dot" filter="url(#hudGlow)" />
  <text x="50" y="38" fill="#00FF66" font-size="13" class="hud-text" letter-spacing="1.5">
    SYSTEM NODE // AMIT_KUMAR_PRADHAN // STATUS: OPERATIONAL [ONLINE]
  </text>
  <text x="760" y="38" fill="#10B981" font-size="12" class="hud-text">
    SECURE_SSL: TRUE
  </text>
  <line x1="20" y1="48" x2="860" y2="48" stroke="#00FF66" stroke-opacity="0.3" stroke-width="1" />

  <!-- Content Grid -->
  <!-- Left Column: Core Focus -->
  <g transform="translate(30, 68)">
    <text x="0" y="14" fill="#6ee7b7" font-size="11" class="hud-text" letter-spacing="1">▶ CORE SPECIALIZATION</text>
    <text x="0" y="34" fill="#ffffff" font-size="15" font-family="'Segoe UI', Roboto, sans-serif" font-weight="700">
      AI Architect &amp; Creative Developer
    </text>
    <text x="0" y="54" fill="#a7f3d0" font-size="12" class="hud-text">
      B.Tech Computer Science • Bhubaneswar
    </text>
  </g>

  <!-- Middle Column: Current Mission -->
  <g transform="translate(350, 68)">
    <text x="0" y="14" fill="#6ee7b7" font-size="11" class="hud-text" letter-spacing="1">▶ CURRENT DIRECTIVE</text>
    <text x="0" y="34" fill="#ffffff" font-size="14" font-family="'Segoe UI', Roboto, sans-serif" font-weight="600">
      Building Intelligent Tools &amp; Web UX
    </text>
    <text x="0" y="54" fill="#a7f3d0" font-size="12" class="hud-text">
      Next.js • Python • AI Agents • GSAP
    </text>
  </g>

  <!-- Right Column: System Power / Coffee Meter -->
  <g transform="translate(630, 68)">
    <text x="0" y="14" fill="#6ee7b7" font-size="11" class="hud-text" letter-spacing="1">▶ ENERGY CAPACITY</text>
    <text x="180" y="14" fill="#00FF66" font-size="11" class="hud-text" text-anchor="end">98.4%</text>
    <!-- Progress Bar BG -->
    <rect x="0" y="24" width="210" height="10" rx="5" fill="#022c22" stroke="#00FF66" stroke-width="1" stroke-opacity="0.4" />
    <rect x="2" y="26" width="198" height="6" rx="3" fill="url(#neonBarGrad)" filter="url(#hudGlow)" />
    <text x="0" y="54" fill="#a7f3d0" font-size="11" class="hud-text">
      TURBO: ACTIVE | LATENCY: 12ms
    </text>
  </g>

  <!-- Bottom Accent Line -->
  <line x1="30" y1="145" x2="850" y2="145" stroke="#00FF66" stroke-opacity="0.2" stroke-width="1" />
  <text x="30" y="162" fill="#00FF66" font-size="10" class="hud-text" letter-spacing="1">
    [ENCRYPTION: AES-256] ── [ENV: PRODUCTION] ── [READY FOR COLLABORATION]
  </text>
  <text x="850" y="162" fill="#00FF66" font-size="10" class="hud-text" text-anchor="end" letter-spacing="1">
    2026.SYS.V2
  </text>
</svg>
